name: Collect and deploy Rico
on:
  workflow_dispatch:
  # Public repository; zero-cost account conditions verified before activation.
  schedule:
    - cron: '17 0,12 * * *' # 09:17 / 21:17 Asia/Tokyo
permissions:
  contents: read
concurrency:
  group: rico-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false && vars.ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify code and workflow constraints
        run: python -m unittest discover -s tests -v
      - name: Restore bounded data from previous Pages deployment
        env:
          RICO_REPOSITORY: ${{ github.repository }}
        run: python collector/restore.py
      - name: Collect feeds (publish failure status with previous data if necessary)
        id: collection
        continue-on-error: true
        run: python collector/collect.py
      - name: Validate static payload
        run: python collector/validate.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Signal total collection failure
        if: steps.collection.outcome == 'failure'
        run: |
          echo 'All feeds failed. Previous bounded data and failure status published.'
          exit 1
  maintenance:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'failure') && github.event.repository.private == false && vars.ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Maintain schedule only after 30 days of inactivity
        env:
          RICO_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 collector/maintenance.py
