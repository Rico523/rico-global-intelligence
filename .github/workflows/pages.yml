name: Collect and deploy Rico
on:
  workflow_dispatch:
  # Enable only after owner approval and zero-cost account verification.
  # schedule:
  #   - cron: '17 0,12 * * *' # 09:17 / 21:17 Asia/Tokyo
permissions:
  contents: read
concurrency:
  group: rico-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false && vars.ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify code and workflow constraints
        run: python -m unittest discover -s tests -v
      - name: Restore bounded data from previous Pages deployment
        env:
          RICO_REPOSITORY: ${{ github.repository }}
        run: python collector/restore.py
      - name: Collect feeds (publish failure status with previous data if necessary)
        id: collection
        continue-on-error: true
        run: python collector/collect.py
      - name: Validate static payload
        run: python collector/validate.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Signal total collection failure
        if: steps.collection.outcome == 'failure'
        run: |
          echo 'All feeds failed. Previous bounded data and failure status published.'
          exit 1
  maintenance:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'failure') && github.event.repository.private == false && vars.ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Maintain schedule only after 30 days of inactivity
        env:
          RICO_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 collector/maintenance.py
