name: PR source checks (no deployment)
on:
  pull_request:
    paths:
      - 'collector/**'
      - 'config/**'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rico-source-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false && vars.ZERO_COST_CONFIRMED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js
      - name: Verify real feeds without publishing or storing article content
        run: python collector/check_sources.py --report "$RUNNER_TEMP/source-check.json"
